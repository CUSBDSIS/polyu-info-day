name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -R index.html web.css cellhash.js pixelfont.js infoday.js infoday-3d.js \
                assets vendor .nojekyll _site/
          # Pages caches for ten minutes; a query string per commit makes
          # every deploy fetch fresh scripts instead of running old ones.
          v="${GITHUB_SHA::7}"
          sed -i -E \
            -e "s#(src=\"[^\"?:]*\.js)\"#\1?v=${v}\"#g" \
            -e "s#(href=\"[^\"?:]*\.css)\"#\1?v=${v}\"#g" \
            -e "s#(\"\./vendor/three\.module\.js)\"#\1?v=${v}\"#g" _site/index.html

      - name: Check the site
        run: |
          set -e
          # Helvetica Neue is licensed; the build refuses to publish a binary
          if find _site \( -name '*.otf' -o -name '*.ttf' -o -name '*.woff' \
                        -o -name '*.woff2' -o -name '*.psd' \) | grep -q .; then
            echo "licensed binaries found; refusing to publish"; exit 1
          fi
          for f in index.html web.css cellhash.js pixelfont.js infoday.js infoday-3d.js \
                   vendor/three.module.js vendor/RoomEnvironment.js \
                   assets/bdsis-lockup-colour.svg assets/bdsis-lockup-white.svg; do
            test -f "_site/$f" || { echo "missing _site/$f"; exit 1; }
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
